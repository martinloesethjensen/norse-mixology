name: App

# Generates the Xcode project from project.yml and builds the app for the simulator, so
# app-target Swift (which `swift test` never compiles) is checked on every PR.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/app.yml"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: xcodebuild (NorseMixology)
    # Standard runner: free on public repositories.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      # A committed project.pbxproj that differs from what project.yml generates can
      # silently leave a new Swift file out of the target, so drift fails the build.
      - name: Committed project matches project.yml
        run: |
          if git diff --quiet -- ios/NorseMixology.xcodeproj; then
            echo "Committed project is up to date with project.yml." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Project drift::ios/NorseMixology.xcodeproj differs from what 'xcodegen generate' produces. Run 'xcodegen generate' in ios/ and commit the result."
            {
              echo "### Project drift"
              echo '```'
              git diff --stat -- ios/NorseMixology.xcodeproj
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild -quiet \
            -project NorseMixology.xcodeproj \
            -scheme NorseMixology \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
