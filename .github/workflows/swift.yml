name: Swift

# Builds NorseMixologyCore and runs its tests on macOS. The package uses SwiftData,
# CryptoKit and os, so it only builds on Apple platforms. AppBundleCatalogTests reads
# the app's bundled catalog, so a catalog sync into ios/NorseMixology/Resources runs it too.
on:
  pull_request:
    paths:
      - "ios/Packages/**"
      - "ios/NorseMixology/Resources/**"
      - ".github/workflows/swift.yml"
  push:
    branches: [main]
    paths:
      - "ios/Packages/**"
      - "ios/NorseMixology/Resources/**"
      - ".github/workflows/swift.yml"

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: swift test (NorseMixologyCore)
    # Standard runner: free on public repositories.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - name: Test
        working-directory: ios/Packages/NorseMixologyCore
        run: swift test
