name: NorseMixology
options:
  bundleIdPrefix: dev.martinloeseth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NorseMixologyCore:
    path: Packages/NorseMixologyCore

targets:
  NorseMixology:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    deploymentTarget: "17.0"
    sources:
      - path: NorseMixology
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.martinloeseth.NorseMixology
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: NorseMixologyCore
